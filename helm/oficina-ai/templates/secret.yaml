apiVersion: v1
kind: Secret
metadata:
  name: oficina-ai-secrets
  namespace: {{ .Values.namespace.name }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  DATABASE_URL: "postgresql+psycopg://{{ .Values.postgres.username }}:{{ .Values.postgres.password }}@postgres:5432/{{ .Values.postgres.database }}"
  REDIS_URL: "redis://redis:6379/0"
  CORS_ORIGINS: {{ .Values.backend.env.corsOrigins | quote }}
---
